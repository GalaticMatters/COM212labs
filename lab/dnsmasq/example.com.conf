# COM212 — local name for the lab web site.
#
# example.com is a real name on the public Internet. These two lines
# keep it inside this dnsmasq:
#   address=   answers A queries with Ubuntu's veth-peer address
#   local=     stops every other query (including AAAA) from being
#              forwarded upstream. Without local=, a browser can
#              follow a public AAAA and open the Internet site.
#
# 10.212.0.1 is only correct if that is Ubuntu's address on veth-peer.
# The lab guide writes this file from the address you measured.
# Do not copy this file over a different address.
address=/example.com/10.212.0.1
local=/example.com/
